name: Release

# Pushing a tag `vX.Y.Z` builds the Windows artifacts through windows-build.yml
# and attaches the portable zip, the MSI and the SHA-256 list to a GitHub
# Release of that tag. The tag must match the crate version in Cargo.toml and
# the version in flutter/pubspec.yaml; a mismatch fails before anything is
# built.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Tag must equal Cargo.toml and pubspec.yaml versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          pub=$(sed -n 's/^version: \([0-9.]*\)+.*/\1/p' flutter/pubspec.yaml | head -1)
          echo "tag=$tag crate=$crate pubspec=$pub"
          [ "$tag" = "$crate" ] || { echo "::error::tag $tag != Cargo.toml version $crate"; exit 1; }
          [ "$tag" = "$pub" ] || { echo "::error::tag $tag != pubspec.yaml version $pub"; exit 1; }

  build:
    needs: [check-version]
    uses: ./.github/workflows/windows-build.yml
    secrets: inherit

  publish:
    needs: [build]
    runs-on: ubuntu-22.04
    steps:
      - name: Download the Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openuu-windows-x86_64
          path: ./SignOutput
      - name: Show what will be published
        run: ls -l ./SignOutput && cat ./SignOutput/*SHA256SUMS.txt
      - name: Publish Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenUU ${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            ./SignOutput/openuu-*.msi
            ./SignOutput/openuu-*.zip
            ./SignOutput/openuu-*-SHA256SUMS.txt
