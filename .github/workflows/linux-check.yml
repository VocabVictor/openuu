# Linux compile check for the Rust crate with the flutter feature (lib + tests).
# The Windows build machine cannot compile the Linux-only modules, so their file splits
# are verified here: push the work to a ci/** branch and watch this run.
# Dependencies copy the x86_64-unknown-linux-gnu job of ci.yml; the bridge files come
# from bridge.yml like flutter-build.yml does.
name: Linux check

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches:
      - master
      - "ci/**"

env:
  RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  # vcpkg version: 2026.07.29. If this changes, run `vcpkg x-update-baseline` for vcpkg.json.
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  linux-check:
    name: x86_64-unknown-linux-gnu (ubuntu-22.04)
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install prerequisites
        shell: bash
        run: |
          sudo apt-get -y update
          sudo apt-get install -y \
             clang \
             cmake \
             curl \
             gcc \
             git \
             g++ \
             libasound2-dev \
             libunwind-dev \
             libgstreamer1.0-dev \
             libgstreamer-plugins-base1.0-dev \
             libgtk-3-dev \
             libpulse-dev \
             libva-dev \
             libvdpau-dev \
             libxcb-randr0-dev \
             libxcb-shape0-dev \
             libxcb-xfixes0-dev \
             libxdo-dev \
             libxfixes-dev \
             nasm \
             wget

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --x-install-root="$VCPKG_ROOT/installed"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: ''

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: linux-check-ubuntu-22.04

      - name: cargo check (lib, flutter feature)
        shell: bash
        run: cargo check --locked --lib --features flutter --target ${{ env.TARGET }}

      - name: cargo check (lib + tests, flutter feature)
        shell: bash
        run: cargo check --locked --lib --tests --features flutter --target ${{ env.TARGET }}

      - name: cargo check (lib, flutter + drm features)
        shell: bash
        run: cargo check --locked --lib --features flutter,drm --target ${{ env.TARGET }}

  # A prerequisite that never ran must not read as a pass. When the bridge job
  # cannot start (an account spending stop did exactly that on 2026-09-13), the
  # job below it is skipped, and a skipped job shows as a grey tick rather than
  # a failure — the check silently stops guarding. This job turns any
  # non-success prerequisite, skipped and cancelled included, into a red run.
  guard:
    name: prerequisites actually ran
    needs: [generate-bridge, linux-check]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Every prerequisite must have succeeded
        shell: bash
        env:
          BRIDGE_RESULT: ${{ needs.generate-bridge.result }}
          CHECK_RESULT: ${{ needs.linux-check.result }}
        run: |
          echo "generate-bridge: $BRIDGE_RESULT"
          echo "linux-check: $CHECK_RESULT"
          if [ "$BRIDGE_RESULT" != success ] || [ "$CHECK_RESULT" != success ]; then
            echo "::error::a prerequisite did not succeed; skipped or cancelled counts as a failure"
            exit 1
          fi
